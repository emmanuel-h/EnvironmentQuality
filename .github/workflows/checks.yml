# The gates, run by something other than whoever remembers to.
#
# `release` is its own job because R8, resource shrinking and the Compose
# compiler are not exercised by any debug build: a compiler bump can break
# `bundleRelease` and only `bundleRelease` while the unit tests stay green.
name: checks

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: unit tests
            task: testDebugUnitTest
          # NewApi is fatal: it is what stands between minSdk 24 and java.time.
          - name: lint
            task: lintDebug
          - name: release bundle
            task: bundleRelease lintVitalRelease
    name: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: ./gradlew ${{ matrix.task }}
        run: ./gradlew --no-daemon ${{ matrix.task }}

      - name: Upload QA screenshots
        if: always() && matrix.task == 'testDebugUnitTest'
        uses: actions/upload-artifact@v7
        with:
          name: qa-screenshots
          path: app/build/qa-screenshots/
          if-no-files-found: ignore
          retention-days: 14

      # TEMPORARY: lets the screenshots be read from the job log; removed before merge.
      - name: Dump QA screenshots
        if: always() && matrix.task == 'testDebugUnitTest'
        run: |
          for f in app/build/qa-screenshots/*.png; do
            [ -f "$f" ] || continue
            echo "QAIMG-BEGIN $(basename "$f")"
            base64 -w 0 "$f" | fold -w 4000
            echo
            echo "QAIMG-END"
          done

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports-${{ strategy.job-index }}
          path: |
            app/build/reports/
          retention-days: 7
